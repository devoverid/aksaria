services:
  app:
    image: devover/aksaria:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aksaria-network

  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
      - POSTGRES_DB=${DB_NAME:-aksaria}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aksaria}"]
      interval: 10s
      timeout: 5s
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - aksaria-network

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300 --label-enable
    restart: unless-stopped
    networks:
      - aksaria-network

networks:
  aksaria-network:
    driver: bridge

volumes:
  db_data: