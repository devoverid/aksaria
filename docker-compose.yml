services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app/src
      - ./db/schema.prisma:/usr/src/app/db/schema.prisma
      - ./prisma.config.ts:/usr/src/app/prisma.config.ts
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
    networks:
      - aksaria-network

  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
      - POSTGRES_DB=${DB_NAME:-aksaria}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aksaria}"]
      interval: 10s
      timeout: 5s
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - aksaria-network

networks:
  aksaria-network:
    driver: bridge

volumes:
  db_data: